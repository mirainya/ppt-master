# Standalone API/worker deployment for a 4 vCPU / 4 GiB Linux host.
# Host PostgreSQL, Redis, and Nginx are reused to minimize memory use.

services:
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    command:
      - uvicorn
      - service.app:app
      - --host
      - 127.0.0.1
      - --port
      - "18000"
    network_mode: host
    environment: &service-environment
      PPT_DATABASE_URL: ${PPT_DATABASE_URL:?Set PPT_DATABASE_URL}
      PPT_REDIS_URL: ${PPT_REDIS_URL:?Set PPT_REDIS_URL}
      PPT_RUNTIME_ROOT: /app/runtime/jobs
      PPT_SESSION_COOKIE_SECURE: ${PPT_SESSION_COOKIE_SECURE:-false}
      PPT_SESSION_COOKIE_SAMESITE: ${PPT_SESSION_COOKIE_SAMESITE:-lax}
      PPT_SESSION_DAYS: ${PPT_SESSION_DAYS:-30}
      PPT_JOB_RETENTION_DAYS: ${PPT_JOB_RETENTION_DAYS:-30}
      PPT_JOB_LEASE_SECONDS: ${PPT_JOB_LEASE_SECONDS:-30}
      PPT_JOB_HEARTBEAT_SECONDS: ${PPT_JOB_HEARTBEAT_SECONDS:-5}
      PPT_RUNTIME_CONFIG_KEY: ${PPT_RUNTIME_CONFIG_KEY:?Set PPT_RUNTIME_CONFIG_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PPT_RUNNER_MODEL: ${PPT_RUNNER_MODEL:-}
      PPT_IMAGE_API_KEY: ${PPT_IMAGE_API_KEY:-}
      PPT_IMAGE_BASE_URL: ${PPT_IMAGE_BASE_URL:-https://prism.example.com/v1}
      PPT_IMAGE_MODEL: ${PPT_IMAGE_MODEL:-gpt_image2}
      PPT_IMAGE_SIZE: ${PPT_IMAGE_SIZE:-2048x1536}
      PPT_IMAGE_CONCURRENCY: ${PPT_IMAGE_CONCURRENCY:-auto}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    volumes:
      - runtime_data:/app/runtime/jobs
    mem_limit: 384m
    memswap_limit: 768m
    cpus: 0.75
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: service/Dockerfile
    command: ["python", "-m", "service.worker"]
    init: true
    network_mode: host
    shm_size: 512mb
    environment:
      <<: *service-environment
      CODEX_HOME: /home/pptmaster/.codex
      MALLOC_ARENA_MAX: "2"
    volumes:
      - runtime_data:/app/runtime/jobs
      - codex_data:/home/pptmaster/.codex
    mem_limit: 1536m
    memswap_limit: 3072m
    cpus: 2.75
    restart: unless-stopped

volumes:
  codex_data:
  runtime_data:
