<svg width="520" height="180" viewBox="0 0 520 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="叙卷 Xujuan logo">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECDD"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232A3B"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4356"/>
      <stop offset="0.5" stop-color="#232A3B"/>
      <stop offset="1" stop-color="#3A4356"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#141824" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ===== 卷轴图标 ===== -->
  <g filter="url(#soft)">
    <!-- 展开的画卷（演示页面） -->
    <rect x="52" y="46" width="96" height="88" rx="6" fill="url(#paper)" stroke="#E0D6C0" stroke-width="1.5"/>
    <!-- 叙事内容：标题条 + 三行文字 -->
    <rect x="66" y="62" width="42" height="9" rx="4.5" fill="#232A3B"/>
    <rect x="66" y="82" width="68" height="5" rx="2.5" fill="#8C93A3"/>
    <rect x="66" y="94" width="68" height="5" rx="2.5" fill="#8C93A3"/>
    <rect x="66" y="106" width="46" height="5" rx="2.5" fill="#8C93A3"/>
  </g>

  <!-- 左右卷杆 -->
  <g>
    <rect x="34" y="40" width="20" height="100" rx="10" fill="url(#rod)"/>
    <rect x="146" y="40" width="20" height="100" rx="10" fill="url(#rod)"/>
    <circle cx="44" cy="52" r="3" fill="#C9A86A"/>
    <circle cx="44" cy="128" r="3" fill="#C9A86A"/>
    <circle cx="156" cy="52" r="3" fill="#C9A86A"/>
    <circle cx="156" cy="128" r="3" fill="#C9A86A"/>
  </g>

  <!-- 朱红印章 -->
  <g transform="translate(128,108)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="#D0432E"/>
    <text x="13" y="19" font-family="'Songti SC','STSong','Source Han Serif SC',serif" font-size="16" fill="#FFF" text-anchor="middle" font-weight="700">叙</text>
  </g>

  <!-- ===== 文字锁版 ===== -->
  <g>
    <text x="196" y="86" font-family="'Songti SC','STSong','Source Han Serif SC',serif" font-size="58" fill="#1A1F2E" font-weight="700" letter-spacing="6">叙卷</text>
    <text x="198" y="116" font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="20" fill="#D0432E" letter-spacing="3" font-weight="600">Xùjuàn</text>
    <text x="199" y="140" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#8C93A3" letter-spacing="2">AI 演示生成 · 一卷叙尽</text>
  </g>
</svg>
